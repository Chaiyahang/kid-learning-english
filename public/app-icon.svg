<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="儿童英语复习">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b94ff"/>
      <stop offset="1" stop-color="#2f66ef"/>
    </linearGradient>
    <linearGradient id="blockFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd869"/>
      <stop offset="1" stop-color="#ffc02e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- toy block: top face, right face, front face -->
  <polygon points="88,190 128,150 372,150 332,190" fill="#ffe9a8"/>
  <polygon points="332,190 372,150 372,394 332,434" fill="#efab12"/>
  <rect x="88" y="190" width="244" height="244" rx="46" fill="url(#blockFront)"/>

  <!-- letter A -->
  <g fill="#1f2a44">
    <polygon points="196,236 222,236 168,392 142,392"/>
    <polygon points="196,236 222,236 276,392 250,392"/>
    <rect x="156" y="314" width="104" height="26" rx="8"/>
  </g>

  <!-- speech bubble with sound waves -->
  <rect x="286" y="92" width="172" height="118" rx="46" fill="#ffffff"/>
  <polygon points="322,204 356,204 330,242" fill="#ffffff"/>
  <g fill="none" stroke="#2f66ef" stroke-width="11" stroke-linecap="round">
    <path d="M348 128a28 28 0 0 1 0 46"/>
    <path d="M378 116a52 52 0 0 1 0 70"/>
    <path d="M408 104a76 76 0 0 1 0 94"/>
  </g>
  <circle cx="330" cy="151" r="12" fill="#2f66ef"/>
</svg>
